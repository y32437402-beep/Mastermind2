<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">


<div id="game-header">
    <div class="stat-item">
        <span class="label">time:</span>
        <span id="timer">00:00</span>
    </div>

</div>
<link rel="stylesheet" href="Mastermind.css">

<p id="type">Refresh</p>
<div class="card1" id="card1">
    Click this for start!
</div>

<div class="start" id="start">

    <div class="container noselect">
        <div class="canvas">
            <div class="tracker tr-1"></div>
            <div class="tracker tr-2"></div>
            <div class="tracker tr-3"></div>
            <div class="tracker tr-4"></div>
            <div class="tracker tr-5"></div>
            <div class="tracker tr-6"></div>
            <div class="tracker tr-7"></div>
            <div class="tracker tr-8"></div>
            <div class="tracker tr-9"></div>
            <div id="card">
                <div class="card-content">
                    <div class="card-glare"></div>
                    <div class="cyber-lines">
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <p id="prompt">Click</p>
                    <div class="title">MASTER<br />MIND2</div>
                    <div class="glowing-elements">
                        <div class="glow-1"></div>
                        <div class="glow-2"></div>
                        <div class="glow-3"></div>
                    </div>
                    <div class="subtitle">
                        <span>2026</span>
                        <span class="highlight"></span>
                    </div>
                    <div class="card-particles">
                        <span></span><span></span><span></span> <span></span><span></span><span></span>
                    </div>
                    <div class="corner-elements">
                        <span></span><span></span><span></span><span></span>
                    </div>
                    <div class="scan-line"></div>
                </div>
            </div>
        </div>
    </div>

</div>
</div>

</div>
<div class="game-container" id="game-container">
    <!-- بخش نمایش نتیجه و رنگ‌های مخفی -->

    <div class="all" id="all">
        <div id="secret-row" class="row">
            <div class="slot hidden" id="s0">?</div>
            <div class="slot hidden" id="s1">?</div>
            <div class="slot hidden" id="s2">?</div>
            <div class="slot hidden" id="s3">?</div>
        </div>

        <!-- بخش حدس کاربر -->
        <div id="guess-row" class="row">
            <!-- در فایل HTML -->
            <div id="g0" class="slot" onclick="changeColor(0)"></div>
            <div id="g1" class="slot" onclick="changeColor(1)"></div>
            <div id="g2" class="slot" onclick="changeColor(2)"></div>
            <div id="g3" class="slot" onclick="changeColor(3)"></div>
        </div>
    </div>
</div>

</div>
<div class="btns" id="btns">
    <button id="btn1" class="button" onclick="checkGuess()">initilize</button>
    <button class="button" id="btn2">again</button>
</div>

<script src="Mastermind.js"></script>
